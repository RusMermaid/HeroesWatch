# Public HTTP also serves the existing IP certificate's ACME challenges.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name heroeswatch.net www.heroeswatch.net 159.198.39.12;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/heroeswatch-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://heroeswatch.net$request_uri;
    }
}

# Xray owns public TLS port 443. Only the domain SNI fallbacks reach here.
server {
    listen 127.0.0.1:18081 default_server;
    server_name _;
    server_tokens off;
    return 404;
}

server {
    listen 127.0.0.1:18081;
    server_name www.heroeswatch.net;
    server_tokens off;
    return 308 https://heroeswatch.net$request_uri;
}

server {
    listen 127.0.0.1:18081;
    server_name heroeswatch.net;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Xray's xver=0 fallback provides no authenticated client address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        add_header X-Content-Type-Options nosniff always;
    }
}
