name: Website build

on:
  push:
    branches: [main]
    paths:
      - "src/web/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "src/web/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

jobs:
  build:
    name: ASP.NET Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore src/web/HeroesWatch.sln
      - name: Build
        run: dotnet build src/web/HeroesWatch.sln --configuration Release --no-restore
      - name: Publish portable application
        run: dotnet publish src/web/HeroesWatch.Web.csproj --configuration Release --no-build --no-self-contained --output "${{ runner.temp }}/heroeswatch-web"
